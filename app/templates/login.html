{% extends "base.html" %}
{% block title %}Iniciar sesion - Gestion Academica{% endblock %}
{% block auth_content %}
<section class="auth-card fade-in">
  <div class="auth-card__logo">
    <img
      src="{{ url_for('static', path='img/Universidad_belgrano_logo23.png') | replace('http://', '//') }}"
      alt="Universidad de Belgrano"
    />
  </div>
  <div class="auth-card__header">
    <div>
      <h1>Sistema de Gestión Académica</h1>
      <p>Ingresa con tus credenciales institucionales.</p>
    </div>
  </div>
  <form
    method="post"
    action="{{ url_for('login_action') }}"
    class="form"
    data-loading="true"
  >
    <div class="form-group">
      <label for="email"><i class="fas fa-envelope"></i> Correo electronico</label>
      <input id="email" name="email" type="email" placeholder="Ingresa tu correo" required />
    </div>
    <div class="form-group">
      <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
      <input id="password" name="password" type="password" placeholder="********" required />
    </div>
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-arrow-right-to-bracket"></i>
      Ingresar
    </button>
    <p class="auth-hint">
      Credenciales demo: admin@demo.com / alumno1@demo.com / docente1@demo.com (clave 1234)
    </p>
  </form>
</section>
{% endblock %}
